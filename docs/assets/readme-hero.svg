<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Nexvio — Practice the interview. Measure the delivery.</title>
  <desc id="desc">Nexvio analyzes recorded mock-interview videos for speech, emotion and posture signals with two Python microservices and presents feedback in a React web app.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#2a1230"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#f472b6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <rect width="1200" height="460" rx="24" fill="url(#dots)"/>
  <path d="M700 0H1100L800 460H400Z" fill="#f472b6" opacity=".04"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="m57 40 16-8 16 8-16 8Zm0 8 16 8 16-8M57 56l16 8 16-8" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="103" y="56" fill="#f8fafc" font-size="23.0" font-weight="700">Nex<tspan fill="#f472b6">vio</tspan></text>
    <text x="56" y="128" fill="#f8fafc" font-size="54.0" font-weight="750" letter-spacing="-2">Practice the interview.</text>
    <text x="56" y="190" fill="url(#accent)" font-size="54.0" font-weight="750" letter-spacing="-2">Measure the delivery.</text>
    <text x="58" y="228" fill="#cbd5e1" font-size="18.0">Video, speech and posture analysis that turns a mock interview into feedback.</text>
    <rect x="842" y="72" width="302" height="159" rx="14" fill="#0b1020" stroke="#37304f"/>
    <path d="M842 110h302" stroke="#37304f"/>
    <circle cx="861" cy="91" r="4" fill="#f472b6"/><circle cx="876" cy="91" r="4" fill="#475569"/><circle cx="891" cy="91" r="4" fill="#475569"/>
    <text x="916" y="96" fill="#94a3b8" font-size="12">interview / analysis</text>
    <g font-family="Consolas,Monaco,monospace" font-size="14.0">
      <text x="862" y="138" fill="#f472b6">video<tspan fill="#94a3b8"> → transcript</tspan></text>
      <text x="862" y="166" fill="#a78bfa">speech<tspan fill="#94a3b8"> → prosody + fillers</tspan></text>
      <text x="862" y="194" fill="#38bdf8">posture<tspan fill="#94a3b8"> → joint angles</tspan></text>
    </g>
    <g fill="#191c30" stroke="#35354e">
      <rect x="56" y="282" width="258" height="106" rx="12"/>
      <rect x="332" y="282" width="258" height="106" rx="12"/>
      <rect x="608" y="282" width="258" height="106" rx="12"/>
      <rect x="884" y="282" width="260" height="106" rx="12"/>
    </g>
    <g fill="#f472b6" font-size="12" font-weight="700" letter-spacing="2">
      <text x="76" y="309">01 / RECORD</text>
      <text x="352" y="309">02 / EXTRACT</text>
      <text x="628" y="309">03 / ANALYZE</text>
      <text x="904" y="309">04 / IMPROVE</text>
    </g>
    <text x="76" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Answer on camera</text>
    <text x="76" y="367" fill="#94a3b8" font-size="13.0">Browser webcam session</text>
    <text x="352" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Measure the speech</text>
    <text x="352" y="367" fill="#94a3b8" font-size="13.0">AssemblyAI + Praat</text>
    <text x="628" y="341" fill="#f1f5f9" font-size="16.8" font-weight="650">Score delivery + posture</text>
    <text x="628" y="367" fill="#94a3b8" font-size="13.0">FER, MediaPipe, scikit-learn</text>
    <text x="904" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Read targeted tips</text>
    <text x="904" y="367" fill="#94a3b8" font-size="13.0">Reports + history</text>
    <text x="56" y="428" fill="#64748b" font-size="13">React Router 7 · TypeScript · Supabase · Flask · scikit-learn · FER · MediaPipe · Docker</text>
